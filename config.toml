baseURL = 'https://madhavkhoslaa.github.io/'
locale = 'en'
title = 'Madhav Khosla'
theme = "hugo-theme-yue"
copyright = "© Madhav Khosla"

enableInlineShortcodes = true
enableRobotsTXT = true
enableEmoji = true

ignoreErrors = ["error-remote-getjson"]

# dev server only: stop phones/browsers on the LAN from caching
# stale HTML/CSS while iterating on layout changes
[server]
  [[server.headers]]
    for = "/**"
    [server.headers.values]
      Cache-Control = "no-cache, no-store, must-revalidate"

[frontmatter]
  lastmod = ['lastmod', ':default']

[params]
  _merge = "deep"
  description = "Systems engineer. Linux kernel, eBPF, networking. C and Rust."
  mainSections = ["posts"]
  dateFormat = "Jan 02, 2006"
  author = "Madhav Khosla"
  rssFullContent = true
  homePagerSize = 10
  sectionPagerSize = 10000
  [params.footer.copyright]
    yearStart = 2019
    author = "Madhav Khosla"

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 20
  [[menus.main]]
    name = "Projects & OSS"
    pageRef = "/projects"
    weight = 30
  [[menus.main]]
    name = "Archive"
    pageRef = "/archive"
    weight = 40
  [[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 50
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 60

[taxonomies]
  tag = "tags"

[markup]
  _merge = "deep"
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
