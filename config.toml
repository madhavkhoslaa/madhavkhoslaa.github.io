baseURL = 'https://madhavkhoslaa.github.io/'
languageCode = 'en'
title = 'Madhav Khosla'
theme = "termrice"
author = "Madhav Khosla"
copyright = "© Madhav Khosla"

enableInlineShortcodes = true
enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

ignoreErrors = ["error-remote-getjson"]

[pagination]
  pagerSize = 5

# dev server only: stop phones/browsers on the LAN from caching
# stale HTML/CSS while iterating on layout changes
[server]
  [[server.headers]]
    for = "/**"
    [server.headers.values]
      Cache-Control = "no-cache, no-store, must-revalidate"

# fragment output used by the modal overlay to fetch a post's
# body via JS without a full page navigation
[outputFormats]
  [outputFormats.FRAG]
    mediaType = "text/html"
    baseName = "fragment"
    isPlainText = false
    notAlternative = true

[outputs]
  page = ["HTML", "FRAG"]

[params]
  noindex = false

[params.about]
  title = "Madhav Khosla"
  description = "Systems Engineering | Backend"

[[params.socialLinks]]
  icon = "fa-brands fa-github"
  title = "GitHub"
  url = "https://github.com/madhavkhoslaa"

[[params.socialLinks]]
  icon = "fa-brands fa-twitter"
  image = "images/x-logo.png"
  title = "Twitter"
  url = "https://x.com/futexmaxxing"

[[params.socialLinks]]
  icon = "fa-brands fa-linkedin"
  title = "LinkedIn"
  url = "https://www.linkedin.com/in/madhavkhoslaa/"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "archive"
    name = "Archive"
    url = "/archive/"
    weight = 2
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 3
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 4
  [[menu.main]]
    identifier = "draft"
    name = "Draft"
    url = "/draft/"
    weight = 5

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = true
