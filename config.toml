baseURL = 'https://madhavkhoslaa.github.io/'
locale = 'en'
title = 'Madhav Khosla'
theme = "no-fate"
author = "Madhav Khosla"
copyright = "© Madhav Khosla"

enableInlineShortcodes = true
enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

ignoreErrors = ["error-remote-getjson"]

[pagination]
  pagerSize = 20

# dev server only: stop phones/browsers on the LAN from caching
# stale HTML/CSS while iterating on layout changes
[server]
  [[server.headers]]
    for = "/**"
    [server.headers.values]
      Cache-Control = "no-cache, no-store, must-revalidate"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  noindex = false
  description = "Systems Engineering | Backend"
  defaultTheme = "light"
  disableThemeToggle = true
  mainSections = ["posts"]
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true

[params.noFate]
  style = "wild"
  defaultMode = "editorial"
  showThemeToggle = false
  showSearch = true
  showReadingTime = true

[params.noFate.wild]
  masthead = "Backend and systems engineer"
  issue = "Kernel / eBPF / networking"

[params.about]
  title = "Madhav Khosla"
  description = "Systems Engineering | Backend"

[[params.socialLinks]]
  icon = "fa-brands fa-github"
  title = "GitHub"
  url = "https://github.com/madhavkhoslaa"

[[params.socialLinks]]
  icon = "fa-brands fa-twitter"
  image = "images/x-logo.png"
  title = "Twitter"
  url = "https://x.com/futexmaxxing"

[[params.socialLinks]]
  icon = "fa-brands fa-linkedin"
  title = "LinkedIn"
  url = "https://www.linkedin.com/in/madhavkhoslaa/"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 1
  [[menu.main]]
    identifier = "projects"
    name = "Projects & OSS"
    url = "/projects/"
    weight = 2
  [[menu.main]]
    identifier = "archive"
    name = "Archive"
    url = "/archive/"
    weight = 3
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 4
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 5

[taxonomies]
  tag = "tags"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = true
